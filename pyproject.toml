[project]
name = "grimstrade"
version = "0.1.0"
description = "Paper-trading agent: real market data, fake money, honest forward-test ledger"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
# Keep ruff in step with the rev in .pre-commit-config.yaml.
dev = [
    "mypy~=2.3",
    "numpy>=2.5.4",
    "pre-commit~=4.0",
    "pytest>=8.3",
    "ruff~=0.15.22",
    "scikit-learn>=1.9.1",
    "xlrd>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grimstrade"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
