name: Daily paper trading

# Every day after the US close: fetch bars, decide, append to the ledger, commit it to the
# paper-trail branch before any outcome exists. Plain Python, no LLM.
on:
  schedule:
    - cron: "30 22 * * *" # 22:30 UTC: after the US close in summer and winter
  workflow_dispatch:
    inputs:
      start_new_record:
        description: "Start a new record (only if the paper-trail branch does not exist yet)"
        type: boolean
        default: false

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: read # scripts/intraday-store.sh lists the Actions caches

jobs:
  run:
    # Only code that is on main may write the record (a manual start can pick any branch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Check out the paper trail into trail/
        env:
          START_NEW_RECORD: ${{ inputs.start_new_record }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/checkout-trail.sh
      - name: Ask GitHub whether the trail was rewritten or back-dated
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIL_REVIEWED_UNTIL: ${{ vars.TRAIL_REVIEWED_UNTIL }}
        run: scripts/check-trail-activity.sh trail
      - name: Run
        id: run
        run: uv run python -m grimstrade.run_daily --root trail
      - name: Commit the record
        if: always() && steps.run.outcome != 'skipped'
        working-directory: trail
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Daily run $(date -u +%Y-%m-%dT%H:%MZ)"
          for wait in 2 4 8 16; do
            git push origin HEAD:refs/heads/paper-trail && exit 0
            sleep "$wait"
          done
          exit 1
      # Finer data (hourly bars, funding) for the RL work, after the record is pushed, every step
      # best effort: nothing here can break or delay the trades, the ledger or the record checks.
      # Kept in an Actions cache, not on paper-trail: the sources' terms forbid re-publishing
      # (docs/DECISIONS.md). Runs even when the record step refused or failed: the windows keep
      # rolling either way. The repository variable INTRADAY_COLLECT=off turns it off.
      - name: Restore the intraday store
        id: intraday-restore
        if: "!cancelled() && vars.INTRADAY_COLLECT != 'off'"
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: intraday
          key: intraday-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: intraday-
      - name: Check the intraday store
        id: intraday-store
        if: "!cancelled() && steps.intraday-restore.outcome == 'success'"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MATCHED_KEY: ${{ steps.intraday-restore.outputs.cache-matched-key }}
        run: scripts/intraday-store.sh
      - name: Collect intraday data
        id: intraday
        if: "!cancelled() && steps.intraday-store.outputs.ok == 'yes'"
        continue-on-error: true
        timeout-minutes: 5
        run: uv run python -m grimstrade.run_daily --root trail --intraday intraday
      - name: Save the intraday store
        if: "!cancelled() && steps.intraday.outcome == 'success'"
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: intraday
          key: intraday-${{ github.run_id }}-${{ github.run_attempt }}
